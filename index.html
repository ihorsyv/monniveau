<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --text: #1a1814;
    --muted: #7a7570;
    --accent: #2d5a4e;
    --accent-light: #e8f0ee;
    --border: #e2ddd6;
    --correct-bg: #eaf3ee;
    --correct-border: #2d5a4e;
    --correct-text: #1a3d2e;
    --wrong-bg: #faeaea;
    --wrong-border: #c0392b;
    --wrong-text: #5c1a1a;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem calc(2rem + env(safe-area-inset-bottom)); }
  .container { max-width: 680px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 1.5rem; animation: fadeDown 0.5s ease; }
  .header-flag { font-size: 2rem; margin-bottom: 0.5rem; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 600; color: var(--text); letter-spacing: -0.5px; margin-bottom: 0.25rem; }
  .header p { font-size: 0.85rem; color: var(--muted); font-weight: 300; }
  .level-track { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.5rem; animation: fadeDown 0.5s ease 0.05s both; }
  .level-pill { font-size: 0.75rem; font-weight: 500; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--card); transition: all 0.2s; }
  .level-pill.active { background: var(--accent); border-color: var(--accent); color: white; }
  .level-pill.done { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .progress-wrap { margin-bottom: 1.25rem; animation: fadeDown 0.5s ease 0.1s both; }
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .progress-label { font-size: 0.78rem; color: var(--muted); }
  .progress-nums { font-size: 0.78rem; font-weight: 500; color: var(--accent); }
  .bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .stats { display: flex; gap: 8px; margin-bottom: 1.25rem; animation: fadeDown 0.5s ease 0.12s both; }
  .stat-pill { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 0.6rem; text-align: center; }
  .stat-pill .val { font-size: 1.05rem; font-weight: 500; line-height: 1; }
  .stat-pill .lbl { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .val-correct { color: var(--correct-border); }
  .val-wrong { color: var(--wrong-border); }
  .val-neutral { color: var(--text); }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.6rem; margin-bottom: 1.25rem; animation: fadeUp 0.4s ease; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .q-tag { font-size: 0.7rem; font-weight: 500; padding: 3px 10px; background: var(--accent-light); color: var(--accent); border-radius: 20px; letter-spacing: 0.3px; }
  .q-number { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
  .q-text { font-family: 'Playfair Display', serif; font-size: 1.12rem; font-weight: 500; line-height: 1.55; margin-bottom: 1.2rem; color: var(--text); }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 0.9rem; line-height: 1.4; background: var(--card); color: var(--text); text-align: left; width: 100%; transition: border-color 0.15s, background 0.15s, transform 0.1s; font-family: 'DM Sans', sans-serif; }
  .opt:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-light); transform: translateX(2px); }
  .opt:active:not(.disabled) { transform: scale(0.99); }
  .opt.disabled { cursor: default; }
  .opt-letter { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 500; color: var(--muted); transition: all 0.15s; margin-top: 1px; }
  .opt.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
  .opt.correct .opt-letter { background: var(--correct-border); border-color: var(--correct-border); color: white; }
  .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-text); }
  .opt.wrong .opt-letter { background: var(--wrong-border); border-color: var(--wrong-border); color: white; }
  .explanation { margin-top: 1rem; padding: 12px 14px; background: #f9f7f4; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 0.85rem; line-height: 1.6; color: var(--muted); display: none; animation: fadeIn 0.3s ease; }
  .explanation.show { display: block; }
  .exp-label { font-size: 0.7rem; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .tr-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-style: italic; color: var(--text); }
  .tr-label { font-size: 0.7rem; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-style: normal; }
  .speak-row { margin-top: 10px; }
  .speak-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--accent); background: var(--accent-light); color: var(--accent); font-size: 0.8rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .speak-btn:hover { background: var(--accent); color: white; }
  .speak-btn:disabled { opacity: 0.45; cursor: default; }
  .nav { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 0.5rem; animation: fadeUp 0.4s ease 0.1s both; }
  .btn-primary { padding: 12px 22px; border-radius: 10px; background: var(--accent); color: white; border: 1px solid var(--accent); font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; width: 100%; }
  .btn-primary:hover:not(:disabled) { background: #1e3f36; border-color: #1e3f36; }
  .btn-primary:disabled { opacity: 0.35; cursor: default; }
  .stage-banner { background: var(--accent-light); border: 1px solid var(--accent); border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1.25rem; animation: fadeUp 0.4s ease; }
  .stage-banner h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent); margin-bottom: 0.4rem; }
  .stage-banner p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
  .result-screen { animation: fadeUp 0.5s ease; }
  .result-hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.2rem 1.5rem; text-align: center; margin-bottom: 1.25rem; }
  .result-level { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 600; color: var(--accent); line-height: 1; margin-bottom: 0.5rem; }
  .result-title { font-size: 1.05rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem; }
  .result-msg { font-size: 0.9rem; line-height: 1.65; color: var(--muted); max-width: 420px; margin: 0 auto 1.4rem; }
  .breakdown { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .breakdown .stat-pill { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.8rem; text-align: center; min-width: 72px; flex: none; }
  .breakdown .val { font-size: 1.05rem; font-weight: 500; color: var(--accent); }
  .breakdown .lbl { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .mistakes-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; margin-bottom: 1.25rem; }
  .mistakes-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .mistakes-badge { font-family: 'DM Sans', sans-serif; font-size: 0.7rem; background: var(--wrong-bg); color: var(--wrong-border); border-radius: 20px; padding: 2px 8px; font-weight: 500; }
  .mistake-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 0.85rem; }
  .mistake-q { font-weight: 500; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
  .mistake-tag { font-size: 0.68rem; color: var(--accent); font-weight: 500; margin-bottom: 4px; display: block; }
  .mistake-answers { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
  .ans-row { font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
  .ans-badge { font-size: 0.65rem; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
  .ans-badge.correct { background: var(--correct-bg); color: var(--correct-border); }
  .ans-badge.wrong { background: var(--wrong-bg); color: var(--wrong-border); }
  .mistake-exp { font-size: 0.78rem; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 6px; }
  .result-nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-restart { padding: 12px 32px; border-radius: 10px; background: var(--accent); color: white; border: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .btn-restart:hover { background: #1e3f36; }
  .cert-hero { position: relative; }
  .cert-seal { font-size: 2rem; margin-bottom: 0.4rem; }
  .cert-date { font-size: 0.72rem; color: var(--muted); margin-top: 1rem; }
  .picker-screen { animation: fadeUp 0.4s ease; }
  .picker-intro { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem; line-height: 1.6; max-width: 480px; margin-left: auto; margin-right: auto; }
  .picker-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 0.75rem; }
  .picker-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.3rem; display: flex; align-items: center; gap: 1rem; animation: fadeUp 0.4s ease; flex-wrap: wrap; }
  .picker-level { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent); font-weight: 600; min-width: 44px; }
  .picker-info { flex: 1; }
  .picker-result { font-size: 0.85rem; color: var(--text); font-weight: 500; }
  .picker-result-empty { color: var(--muted); font-weight: 400; }
  .picker-card .btn-primary { width: auto; padding: 10px 18px; flex: none; }
  .picker-card-actions { display: flex; gap: 8px; flex: none; }
  .btn-outline { padding: 10px 16px; border-radius: 10px; background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 0.85rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .btn-outline:hover { background: var(--accent-light); }
  .cert-controls { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 1.1rem; }
  .cert-name-field { flex: 1 1 220px; margin-bottom: 0; }
  .cert-name-field label, .cert-lang-field label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 6px; }
  .cert-name-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: var(--card); color: var(--text); box-sizing: border-box; }
  .cert-lang-field { flex: none; }
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .lang-toggle button { border: none; padding: 10px 16px; min-height: 40px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; background: var(--card); color: var(--muted); }
  .lang-toggle button.active { background: var(--accent); color: white; }
  .cert-paper { width: min(100%, 940px); margin: 0 auto 1.25rem; background: var(--bg); border: 2px solid var(--accent); border-radius: 4px; padding: 2.4rem; position: relative; box-sizing: border-box; display: flex; }
  .cert-paper::before { content: ''; position: absolute; top: 8px; right: 8px; bottom: 8px; left: 8px; border: 1px solid var(--border); border-radius: 2px; pointer-events: none; }
  .cert-corner { position: absolute; width: 30px; height: 30px; border: 2px solid var(--accent); pointer-events: none; }
  .cert-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .cert-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .cert-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .cert-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
  .cert-inner { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0.4rem 1.6rem; }
  .cert-top-row { display: flex; justify-content: space-between; align-items: center; flex: none; }
  .cert-kicker { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .cert-brand { font-family: 'Playfair Display', serif; font-size: 1.05rem; letter-spacing: 0.15em; color: var(--accent); }
  .cert-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 0; }
  .cert-hr { width: 36px; height: 1px; background: var(--accent); margin: 0 auto 1.4rem; flex: none; }
  .cert-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 600; color: var(--text); text-align: center; margin: 0 0 1.5rem; }
  .cert-confirm { font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .cert-name { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 600; color: var(--accent); margin: 0.6rem auto 1.2rem; border-bottom: 1px solid var(--border); display: block; width: fit-content; padding-bottom: 10px; min-width: 280px; max-width: 90%; word-break: break-word; text-align: center; }
  .cert-body { font-size: 1rem; color: var(--text); line-height: 1.7; max-width: 560px; margin: 0 auto 1.8rem; text-align: center; }
  .cert-topics-title { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.7rem; text-align: center; }
  .cert-topics { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; }
  .cert-topic-chip { font-size: 0.75rem; padding: 5px 13px; border-radius: 20px; background: var(--accent-light); color: var(--accent); border: 1px solid transparent; }
  .cert-footer { display: flex; justify-content: space-between; align-items: center; flex: none; padding-top: 1.2rem; border-top: 1px solid var(--border); gap: 10px; }
  .cert-date-block { text-align: left; font-size: 0.7rem; color: var(--muted); }
  .cert-date-val { font-size: 0.9rem; color: var(--text); margin-top: 3px; font-weight: 500; }
  .cert-seal-badge { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--accent); font-size: 0.6rem; letter-spacing: 0.04em; text-align: center; transform: rotate(-6deg); line-height: 1.25; flex: none; background: var(--card); box-shadow: 0 0 0 4px var(--bg); }
  .cert-seal-badge b { font-size: 1.1rem; display: block; }
  .cert-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .btn-download { padding: 12px 24px; border-radius: 10px; background: var(--card); color: var(--accent); border: 1px solid var(--accent); font-size: 0.85rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .btn-download:hover:not(:disabled) { background: var(--accent-light); }
  .btn-download:disabled { opacity: 0.5; cursor: default; }
  .cert-download-error { text-align: center; font-size: 0.78rem; color: var(--wrong-border); margin: -0.75rem 0 1.25rem; }
  .picker-reset { text-align: center; margin-top: 0.75rem; }
  .link-reset { background: none; border: none; color: var(--muted); font-size: 0.78rem; text-decoration: underline; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 6px; }
  .add-hint { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 1.5rem; line-height: 1.6; }
  .pract-input { width: 100%; min-height: 70px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: var(--card); color: var(--text); box-sizing: border-box; resize: vertical; line-height: 1.5; }
  .pract-input:disabled { background: var(--bg); color: var(--text); opacity: 1; }
  .pract-compare { margin-top: 1rem; }
  .pract-compare-row { margin-bottom: 0.7rem; }
  .pract-compare-label { font-size: 0.7rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .pract-compare-text { font-size: 0.95rem; line-height: 1.6; }
  .diff-ok { color: var(--correct-border); }

function topicLabel(t, lang) {
  return lang === 'fr' && TOPIC_FR[t] ? TOPIC_FR[t] : t;
}

function getApp() { return document.getElementById('app'); }

function isCertEligible(lvl) {
  const r = allResults[lvl];
  if (!r) return false;
  if (r.correct / r.total < GATE[lvl]) return false;
  if (PRACTICAL[lvl]) {
    if (!r.practical) return false;
    if (r.practical.correct / r.practical.total < PRACTICAL_GATE) return false;
  }
  return true;
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      screen, stageIdx, cur, answered, userAns, allResults, certLevel,
      practicalCur, practicalAnswers, practicalShowAnswer, practicalUserInput, inProgress
    }));
  } catch (e) { /* storage unavailable - progress just won't persist */ }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || typeof s.stageIdx !== 'number' || !LEVEL_ORDER[s.stageIdx]) return false;
    screen = s.screen || 'picker';
    stageIdx = s.stageIdx; cur = s.cur || 0;
    answered = s.answered || []; userAns = s.userAns || [];
    allResults = s.allResults || {}; certLevel = s.certLevel || null;
    practicalCur = s.practicalCur || 0; practicalAnswers = s.practicalAnswers || [];
    practicalShowAnswer = !!s.practicalShowAnswer;
    practicalUserInput = s.practicalUserInput || [];
    inProgress = s.inProgress || {};
    return true;
  } catch (e) { return false; }
}

function clearProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// Best-effort French text to pronounce for a question: full sentence with blank filled,
// or a quoted French word/phrase in the question, or the correct option itself if it looks French.
function speakTextFor(q) {
  if (q.q.includes('___')) return q.q.replace(/_+/, q.o[q.a]);
  const quoteMatch = q.q.match(/«([^»]+)»/);
  if (quoteMatch) return quoteMatch[1];
  const ans = q.o[q.a];
  if (!/[а-яА-ЯёЁ]/.test(ans)) return ans;
  return null;
}

function speak(text, btn) {
  if (!('speechSynthesis' in window)) {
    alert('Синтез речи не поддерживается в этом браузере.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.88;
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  if (frVoice) u.voice = frVoice;
  if (btn) { btn.disabled = true; u.onend = () => { btn.disabled = false; }; u.onerror = () => { btn.disabled = false; }; }
  window.speechSynthesis.speak(u);
}

// Some browsers load voices asynchronously - warm the list up.
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function renderLevelTrack() {
  const track = document.getElementById('levelTrack');
  track.innerHTML = LEVEL_ORDER.map((lvl, i) => {
    let cls = 'level-pill';
    if (allResults[lvl]) cls += ' done';
    if (i === stageIdx && (screen === 'banner' || screen === 'question')) cls += ' active';
    return `<span class="${cls}">${lvl}</span>`;
  }).join('');
}

function startApp() {
  const resumed = loadProgress();
  renderLevelTrack();
  if (resumed && screen === 'certificate' && certLevel) renderCertificate(certLevel);
  else if (resumed && screen === 'practical') renderPracticalQuestion(LEVEL_ORDER[stageIdx]);
  else if (resumed && screen === 'practicalBanner') renderPracticalBanner(LEVEL_ORDER[stageIdx]);
  else if (resumed && screen === 'question') { renderQuestion(); if (answered[cur] !== undefined) restoreState(); }
  else if (resumed && screen === 'banner') renderBanner();
  else renderPicker();
  const hint = document.getElementById('addHint');
  if (hint) hint.textContent = 'Открой эту страницу в браузере телефона и добавь на главный экран через «Поделиться → На экран Домой» - тест будет запускаться как отдельное приложение.';
}

function renderPicker() {
  screen = 'picker';
  saveProgress();
  renderLevelTrack();
  const cardsHtml = LEVEL_ORDER.map(lvl => {
    const r = allResults[lvl];
    const infoHtml = r
      ? `<div class="picker-result">${r.correct}/${r.total} · ${Math.round(r.correct / r.total * 100)}%${r.practical ? ` · практика ${Math.round(r.practical.correct / r.practical.total * 100)}%` : ''}</div>`
      : `<div class="picker-result picker-result-empty">ещё не пройден</div>`;
    const reviewBtn = r
      ? `<button class="btn-outline" onclick="viewCertificate('${lvl}')">${isCertEligible(lvl) ? 'Сертификат' : 'Результат'}</button>`
      : '';
    const resumeBtn = inProgress[lvl]
      ? `<button class="btn-primary" onclick="resumeLevel('${lvl}')">Продолжить →</button>`
      : `<button class="btn-primary" onclick="selectLevel('${lvl}')">${r ? 'Пройти заново' : 'Начать'} →</button>`;
    return `
      <div class="picker-card">
        <div class="picker-level">${lvl}</div>
        <div class="picker-info">${infoHtml}</div>
        ${inProgress[lvl] ? `<div class="picker-result">Есть незавершённая попытка</div>` : ''}
        <div class="picker-card-actions">
          ${reviewBtn}
          ${resumeBtn}
        </div>
      </div>
    `;
  }).join('');

function selectLevel(lvl) {

// we were - the snapshot is restored later by resumeLevel() ("Продолжить").

  if (screen === 'question') {

    inProgress[lvl] = { screen, practicalCur, practicalAnswers, practicalShowAnswer, practicalUserInput };

  renderPicker();
}

function resumeLevel(lvl) {
  const ip = inProgress[lvl];
  if (!ip) { selectLevel(lvl); return; }
  stageIdx = LEVEL_ORDER.indexOf(lvl);
  screen = ip.screen;
  cur = ip.cur || 0; answered = ip.answered || []; userAns = ip.userAns || [];
  practicalCur = ip.practicalCur || 0; practicalAnswers = ip.practicalAnswers || [];
  practicalShowAnswer = !!ip.practicalShowAnswer; practicalUserInput = ip.practicalUserInput || [];
  saveProgress();

function choose(i) {

  document.getElementById('nextbtn').disabled = false;

  const q = currentBlock()[cur];
  const i = userAns[cur];
  document.querySelectorAll('.opt').forEach((el, idx) => {

}

function normWord(w) {
  return w.toLowerCase().replace(/^[«»"'".,!?;:()\-]+|[«»"'".,!?;:()\-]+$/g, '');
}

// Простое пословное сравнение (LCS) твоего варианта с эталоном - подсказка,
// а не строгая проверка: другой порядок слов или синоним даст "расхождение",
// хотя перевод может быть вполне правильным. Финальную оценку всё равно
// ставит сам пользователь кнопками "верно/ошибся".
function diffWords(a, b) {
  const na = a.map(normWord), nb = b.map(normWord);
  const n = na.length, m = nb.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = na[i] === nb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const res = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (na[i] === nb[j]) { res.push({ text: a[i], type: 'equal' }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { res.push({ text: a[i], type: 'diff' }); i++; }
    else { j++; }
  }
  while (i < n) { res.push({ text: a[i], type: 'diff' }); i++; }
  return res;
}

function renderCompareHtml(userText, refText) {
  const userWords = userText.trim().split(/\s+/).filter(Boolean);
  const refWords = refText.trim().split(/\s+/).filter(Boolean);
  const userDiff = diffWords(userWords, refWords);
  const refDiff = diffWords(refWords, userWords);
  const userHtml = userDiff.map(d => `<span class="${d.type === 'equal' ? 'diff-ok' : 'diff-bad'}">${escapeHtml(d.text)}</span>`).join(' ');
  const refHtml = refDiff.map(d => d.type === 'equal' ? escapeHtml(d.text) : `<span class="diff-missing">${escapeHtml(d.text)}</span>`).join(' ');
  return `
    <div class="pract-compare">
      <div class="pract-compare-row">
        <div class="pract-compare-label">Твой вариант</div>
        <div class="pract-compare-text">${userHtml}</div>
      </div>

        <div class="pract-compare-label">Эталонный перевод</div>
        <div class="pract-compare-text">${refHtml}</div>
      </div>
    </div>
  `;
}

async function downloadCertificate(lvl) {
  const paper = document.getElementById('certPaper');
  const btn = document.getElementById('certDownloadBtn');
  const errEl = document.getElementById('certDownloadError');
  if (!paper || !btn || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') return;
  const t = CERT_TEXT[certPrefs.lang];
  if (errEl) errEl.style.display = 'none';
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = t.downloadingBtn;
  // Capture a detached clone sized to the exact landscape-A4 shape instead of
  // resizing via html2canvas's own onclone hook - that hook resizes the DOM
  // after html2canvas has already measured it, which leaves absolutely
  // positioned pseudo-elements (like the inset border) stuck at their
  // pre-resize size and produces a stray seam in the rendered image. Building
  // our own pre-sized clone means html2canvas measures the final layout once.
  const captureHeight = Math.round(CERT_CAPTURE_WIDTH_PX * 210 / 297);
  const clone = paper.cloneNode(true);
  clone.id = '';
  clone.style.position = 'fixed';
  clone.style.top = '0';
  clone.style.left = '-99999px';
  clone.style.margin = '0';
  clone.style.width = `${CERT_CAPTURE_WIDTH_PX}px`;
  clone.style.height = `${captureHeight}px`;
  document.body.appendChild(clone);
  try {
    const canvas = await html2canvas(clone, { scale: 2, backgroundColor: '#f7f5f0' });
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
    const name = (certPrefs.name || 'niveau-fr').trim().replace(/\s+/g, '_') || 'niveau-fr';
    pdf.save(`sertifikat-${lvl}-${name}.pdf`);
  } catch (e) {
    if (errEl) errEl.style.display = 'block';
  } finally {
    clone.remove();
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
}

        <div class="stat-pill"><div class="val">${pct}%</div><div class="lbl">результат теста</div></div>
        ${practicalDone ? `<div class="stat-pill"><div class="val">${practicalPct}%</div><div class="lbl">практика</div></div>` : ''}
      </div>
      <div class="cert-date">Для сертификата нужно: тест ≥ ${Math.round(GATE[lvl] * 100)}%${hasPractical ? ` и практическое задание ≥ ${Math.round(PRACTICAL_GATE * 100)}%` : ''}.</div>
      ${testPassed && hasPractical && !practicalDone ? `<div style="margin-top:1rem;"><button class="btn-primary" onclick="renderPracticalBanner('${lvl}')">Начать практическое задание →</button></div>` : ''}
      ${testPassed && hasPractical && practicalDone && !practicalPassed ? `<div style="margin-top:1rem;"><button class="btn-primary" onclick="startPractical('${lvl}')">Повторить практическое задание →</button></div>` : ''}
    </div>
  `;

  getApp().innerHTML = `
    <div class="result-screen">
      ${certHtml}
      ${r.mistakes.length === 0 ? `<div class="mistakes-section"><div style="text-align:center;color:var(--correct-border);">🎉 Ни одной ошибки в этом блоке!</div></div>` : `
        <div class="mistakes-section">
          <div class="mistakes-title">
            Разбор ошибок
            <span class="mistakes-badge">${r.mistakes.length}</span>
          </div>
          ${r.mistakes.map(m => `
            <div class="mistake-item">
              <span class="mistake-tag">${lvl} · ${m.t}</span>
              <div class="mistake-q">${m.q}</div>
              <div class="mistake-answers">
                <div class="ans-row"><span class="ans-badge wrong">Твой ответ</span> ${m.your}</div>
                <div class="ans-row"><span class="ans-badge correct">Правильно</span> ${m.right}</div>
              </div>
              <div class="mistake-exp">${m.e}</div>
            </div>
          `).join('')}
        </div>
      `}
      <div class="result-nav">
        ${nextLvl ? `<button class="btn-restart" onclick="selectLevel('${nextLvl}')">Следующий блок: ${nextLvl} →</button>` : ''}
        <button class="btn-restart" onclick="selectLevel('${lvl}')">Пройти ${lvl} заново</button>
      </div>
      <div class="picker-reset"><button class="link-reset" onclick="renderPicker()">← Все блоки</button></div>
    </div>
  `;
}

function restartAll() {
  stageIdx = 0; cur = 0; answered = []; userAns = []; allResults = {}; certLevel = null; inProgress = {};
  screen = 'picker';
  clearProgress();
  startApp();
}

startApp();
</script>
