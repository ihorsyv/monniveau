<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --text: #1a1814;
    --muted: #7a7570;
    --accent: #2d5a4e;
    --accent-light: #e8f0ee;
    --border: #e2ddd6;
    --correct-bg: #eaf3ee;
    --correct-border: #2d5a4e;
    --correct-text: #1a3d2e;
    --wrong-bg: #faeaea;
    --wrong-border: #c0392b;
    --wrong-text: #5c1a1a;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem calc(2rem + env(safe-area-inset-bottom)); }
  .container { max-width: 680px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 1.5rem; animation: fadeDown 0.5s ease; }
  .header-flag { font-size: 2rem; margin-bottom: 0.5rem; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 600; color: var(--text); letter-spacing: -0.5px; margin-bottom: 0.25rem; }
  .header p { font-size: 0.85rem; color: var(--muted); font-weight: 300; }
  .level-track { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.5rem; animation: fadeDown 0.5s ease 0.05s both; }
  .level-pill { font-size: 0.75rem; font-weight: 500; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--card); transition: all 0.2s; }
  .level-pill.active { background: var(--accent); border-color: var(--accent); color: white; }
  .level-pill.done { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .progress-wrap { margin-bottom: 1.25rem; animation: fadeDown 0.5s ease 0.1s both; }
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .progress-label { font-size: 0.78rem; color: var(--muted); }
  .progress-nums { font-size: 0.78rem; font-weight: 500; color: var(--accent); }
  .bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .stats { display: flex; gap: 8px; margin-bottom: 1.25rem; animation: fadeDown 0.5s ease 0.12s both; }
  .stat-pill { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 0.6rem; text-align: center; }
  .stat-pill .val { font-size: 1.05rem; font-weight: 500; line-height: 1; }
  .stat-pill .lbl { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .val-correct { color: var(--correct-border); }
  .val-wrong { color: var(--wrong-border); }
  .val-neutral { color: var(--text); }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.6rem; margin-bottom: 1.25rem; animation: fadeUp 0.4s ease; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .q-tag { font-size: 0.7rem; font-weight: 500; padding: 3px 10px; background: var(--accent-light); color: var(--accent); border-radius: 20px; letter-spacing: 0.3px; }
  .q-number { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
  .q-text { font-family: 'Playfair Display', serif; font-size: 1.12rem; font-weight: 500; line-height: 1.55; margin-bottom: 1.2rem; color: var(--text); }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 0.9rem; line-height: 1.4; background: var(--card); color: var(--text); text-align: left; width: 100%; transition: border-color 0.15s, background 0.15s, transform 0.1s; font-family: 'DM Sans', sans-serif; }
  .opt:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-light); transform: translateX(2px); }
  .opt:active:not(.disabled) { transform: scale(0.99); }
  .opt.disabled { cursor: default; }
  .opt-letter { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 500; color: var(--muted); transition: all 0.15s; margin-top: 1px; }
  .opt.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
  .opt.correct .opt-letter { background: var(--correct-border); border-color: var(--correct-border); color: white; }
  .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-text); }
  .opt.wrong .opt-letter { background: var(--wrong-border); border-color: var(--wrong-border); color: white; }
  .explanation { margin-top: 1rem; padding: 12px 14px; background: #f9f7f4; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 0.85rem; line-height: 1.6; color: var(--muted); display: none; animation: fadeIn 0.3s ease; }
  .explanation.show { display: block; }
  .exp-label { font-size: 0.7rem; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .tr-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-style: italic; color: var(--text); }
  .tr-label { font-size: 0.7rem; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-style: normal; }
  .speak-row { margin-top: 10px; }
  .speak-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--accent); background: var(--accent-light); color: var(--accent); font-size: 0.8rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .speak-btn:hover { background: var(--accent); color: white; }
  .speak-btn:disabled { opacity: 0.45; cursor: default; }
  .nav { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 0.5rem; animation: fadeUp 0.4s ease 0.1s both; }
  .btn-primary { padding: 12px 22px; border-radius: 10px; background: var(--accent); color: white; border: 1px solid var(--accent); font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; width: 100%; }
  .btn-primary:hover:not(:disabled) { background: #1e3f36; border-color: #1e3f36; }
  .btn-primary:disabled { opacity: 0.35; cursor: default; }
  .stage-banner { background: var(--accent-light); border: 1px solid var(--accent); border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1.25rem; animation: fadeUp 0.4s ease; }
  .stage-banner h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent); margin-bottom: 0.4rem; }
  .stage-banner p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
  .result-screen { animation: fadeUp 0.5s ease; }
  .result-hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.2rem 1.5rem; text-align: center; margin-bottom: 1.25rem; }
  .result-level { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 600; color: var(--accent); line-height: 1; margin-bottom: 0.5rem; }
  .result-title { font-size: 1.05rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem; }
  .result-msg { font-size: 0.9rem; line-height: 1.65; color: var(--muted); max-width: 420px; margin: 0 auto 1.4rem; }
  .breakdown { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .breakdown .stat-pill { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.8rem; text-align: center; min-width: 72px; flex: none; }
  .breakdown .val { font-size: 1.05rem; font-weight: 500; color: var(--accent); }
  .breakdown .lbl { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .mistakes-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; margin-bottom: 1.25rem; }
  .mistakes-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .mistakes-badge { font-family: 'DM Sans', sans-serif; font-size: 0.7rem; background: var(--wrong-bg); color: var(--wrong-border); border-radius: 20px; padding: 2px 8px; font-weight: 500; }
  .mistake-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 0.85rem; }
  .mistake-q { font-weight: 500; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
  .mistake-tag { font-size: 0.68rem; color: var(--accent); font-weight: 500; margin-bottom: 4px; display: block; }
  .mistake-answers { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
  .ans-row { font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
  .ans-badge { font-size: 0.65rem; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
  .ans-badge.correct { background: var(--correct-bg); color: var(--correct-border); }
  .ans-badge.wrong { background: var(--wrong-bg); color: var(--wrong-border); }
  .mistake-exp { font-size: 0.78rem; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 6px; }
  .result-nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-restart { padding: 12px 32px; border-radius: 10px; background: var(--accent); color: white; border: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .btn-restart:hover { background: #1e3f36; }
  .cert-hero { position: relative; }
  .cert-seal { font-size: 2rem; margin-bottom: 0.4rem; }
  .cert-date { font-size: 0.72rem; color: var(--muted); margin-top: 1rem; }
  .picker-screen { animation: fadeUp 0.4s ease; }
  .picker-intro { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem; line-height: 1.6; max-width: 480px; margin-left: auto; margin-right: auto; }
  .picker-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 0.75rem; }
  .picker-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.3rem; display: flex; align-items: center; gap: 1rem; animation: fadeUp 0.4s ease; }
  .picker-level { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent); font-weight: 600; min-width: 44px; }
  .picker-info { flex: 1; }
  .picker-result { font-size: 0.85rem; color: var(--text); font-weight: 500; }
  .picker-result-empty { color: var(--muted); font-weight: 400; }
  .picker-card .btn-primary { width: auto; padding: 10px 18px; flex: none; }
  .picker-reset { text-align: center; margin-top: 0.75rem; }
  .link-reset { background: none; border: none; color: var(--muted); font-size: 0.78rem; text-decoration: underline; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 6px; }
  .add-hint { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 1.5rem; line-height: 1.6; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 480px) {
    body { padding: 1.25rem 0.9rem calc(1.5rem + env(safe-area-inset-bottom)); }
    .header h1 { font-size: 1.3rem; }
    .q-text { font-size: 1rem; }
    .q-card { padding: 1.25rem; }
    .result-level { font-size: 2.4rem; }
  }
</style>

<div class="container">
  <div class="header">
    <div class="header-flag">🇫🇷</div>
    <h1>Тест на уровень французского</h1>
    <p>Уровни A1 · A2 · B1 · с переводом, произношением и сертификатом за каждый блок</p>
  </div>
  <div class="level-track" id="levelTrack"></div>
  <div id="app"></div>
  <div class="add-hint" id="addHint"></div>
</div>
<script>
const BLOCKS = {
  A1: [
    { q: "Je ___ étudiant.", o: ["est","suis","es","sommes"], a: 1, t: "Être", e: "Глагол être: je → SUIS. Je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.", tr: "Я студент." },
    { q: "Elle ___ française.", o: ["suis","sommes","est","êtes"], a: 2, t: "Être", e: "Глагол être: elle → EST.", tr: "Она француженка." },
    { q: "Выбери ВЕРНОЕ предложение:", o: ["Tu es fatigué ?","Tu est fatigué ?","Tu être fatigué ?","Tu suis fatigué ?"], a: 0, t: "Être", e: "Tu es - единственная правильная форма.", tr: "Ты устал?" },
    { q: "Nous ___ contents de vous voir.", o: ["est","êtes","sont","sommes"], a: 3, t: "Être", e: "Глагол être: nous → SOMMES.", tr: "Мы рады вас видеть." },
    { q: "J'___ un chien et un chat.", o: ["est","ai","as","ont"], a: 1, t: "Avoir", e: "Глагол avoir: je → AI.", tr: "У меня есть собака и кошка." },
    { q: "Il ___ vingt ans.", o: ["est","suis","a","ont"], a: 2, t: "Avoir", e: "Возраст → avoir: il a vingt ans.", tr: "Ему двадцать лет." },
    { q: "Vous ___ de la chance !", o: ["avons","avez","ont","ai"], a: 1, t: "Avoir", e: "Avoir: vous → AVEZ.", tr: "Вам везёт!" },
    { q: "Elles ___ faim après le sport.", o: ["est","sont","ont","avons"], a: 2, t: "Avoir", e: "Голод/жажда/жара → avoir: elles ONT faim.", tr: "Они голодны после спорта." },
    { q: "Je mange ___ pomme.", o: ["un","le","la","une"], a: 3, t: "Артикли", e: "Pomme - женский род → une.", tr: "Я ем яблоко." },
    { q: "C'est ___ livre intéressant.", o: ["une","un","la","les"], a: 1, t: "Артикли", e: "Livre - мужской род → un.", tr: "Это интересная книга." },
    { q: "Je bois ___ café le matin.", o: ["un","une","le","du"], a: 3, t: "Артикли", e: "Несчитаемое → партитивный du.", tr: "Я пью кофе по утрам." },
    { q: "Elle écoute ___ musique.", o: ["une","de la","du","la"], a: 1, t: "Артикли", e: "Musique - женский род, несчитаемое → de la.", tr: "Она слушает музыку." },
    { q: "Nous avons ___ enfants.", o: ["de","des","les","du"], a: 1, t: "Артикли", e: "Считаемое множественное → des.", tr: "У нас есть дети." },
    { q: "Je ___ parle ___ anglais.", o: ["ne / pas","pas / ne","n' / pas","ne / jamais"], a: 0, t: "Отрицание", e: "ne + глагол + pas.", tr: "Я не говорю по-английски." },
    { q: "Il ne mange ___ de viande.", o: ["pas","point","jamais","plus"], a: 0, t: "Отрицание", e: "Простое отрицание → ne...pas.", tr: "Он не ест мясо." },
    { q: "Выбери ПРАВИЛЬНОЕ отрицание:", o: ["Je pas aime le froid.","Je n'aime pas le froid.","Je ne aime le froid pas.","Je aime ne pas le froid."], a: 1, t: "Отрицание", e: "Перед гласной: n'aime.", tr: "Я не люблю холод." },
    { q: "Tu ___ où en ce moment ?", o: ["travailles","travaille","travaillez","travaillons"], a: 0, t: "Глаголы 1 группы", e: "Tu → -es.", tr: "Где ты сейчас работаешь?" },
    { q: "Nous ___ le français depuis 6 mois.", o: ["étudions","étudiez","étudient","étudont"], a: 0, t: "Глаголы 1 группы", e: "Nous → -ons.", tr: "Мы изучаем французский уже 6 месяцев." },
    { q: "Ils ___ souvent au restaurant.", o: ["mange","manges","mangent","mangeons"], a: 2, t: "Глаголы 1 группы", e: "Ils/elles → -ent.", tr: "Они часто едят в ресторане." },
    { q: "Vous ___ du sport le weekend ?", o: ["pratiquez","pratiques","pratiquent","pratiquons"], a: 0, t: "Глаголы 1 группы", e: "Vous → -ez.", tr: "Вы занимаетесь спортом по выходным?" },
    { q: "Je ___ au marché demain.", o: ["vas","vais","allons","vont"], a: 1, t: "Aller", e: "Aller: je VAIS.", tr: "Я пойду на рынок завтра." },
    { q: "Elle ___ à l'école à pied.", o: ["vais","va","vas","allons"], a: 1, t: "Aller", e: "Aller, elle → VA.", tr: "Она идёт в школу пешком." },

    { q: "Il refuse ___ partir sans elle.", o: ["à","de","pour","que"], a: 1, t: "Verbes + préposition", e: "Refuser de + infinitif.", tr: "Он отказывается уезжать без неё." },
    { q: "Nous cherchons ___ comprendre la situation.", o: ["de","pour","à","que"], a: 2, t: "Verbes + préposition", e: "Chercher à + infinitif.", tr: "Мы пытаемся понять ситуацию." },
    { q: "Elle a réussi ___ convaincre son patron.", o: ["de","pour","que","à"], a: 3, t: "Verbes + préposition", e: "Réussir à + infinitif.", tr: "Ей удалось убедить своего начальника." },
    { q: "Il ___ beau temps aujourd'hui.", o: ["est","a","fait","va"], a: 2, t: "Expressions idiomatiques", e: "Погода → faire.", tr: "Сегодня хорошая погода." },
    { q: "Elle ___ de son mieux pour t'aider.", o: ["fait","a fait","fera","faisait"], a: 0, t: "Expressions idiomatiques", e: "Faire de son mieux - présent.", tr: "Она старается изо всех сил, чтобы тебе помочь." },
    { q: "La ville ___ je t'ai parlé est magnifique.", o: ["que","qui","dont","où"], a: 2, t: "Pronoms relatifs", e: "Parler de → dont.", tr: "Город, о котором я тебе рассказывал(а), великолепен." },
    { q: "C'est l'homme ___ la femme est médecin.", o: ["que","qui","dont","où"], a: 2, t: "Pronoms relatifs", e: "Dont = принадлежность.", tr: "Это мужчина, чья жена врач." },
    { q: "«Tant que tu travailles, tu progresseras» - «tant que» означает:", o: ["так как","пока / при условии что","поэтому","хотя"], a: 1, t: "Conjonctions", e: "Tant que = пока / до тех пор пока.", tr: "Пока ты работаешь, ты будешь прогрессировать." }
  ]
};

const LEVEL_ORDER = ['A1','A2','B1'];
const GATE = { A1: 0.6, A2: 0.5, B1: 0.5 };
const LEVEL_MESSAGES = {
  A1: { pass: 'Базовый уровень освоен уверенно.', fail: 'Основы être/avoir, артикли и базовая лексика пока плавают. Стоит закрепить фундамент A1 и попробовать ещё раз.' },
  A2: { pass: 'Уверенно владеешь A2. Можно двигаться к B1.', fail: 'A2 (passé composé, местоимения y/en/lui/leur, gérondif) пока даётся с трудом - разбери ошибки ниже и попробуй снова.' },
  B1: { pass: 'B1 пройден уверенно. Готов двигаться к B2.', fail: 'B1 (plus-que-parfait, conditionnel passé, discours indirect) - зона роста. Разбери ошибки ниже и попробуй ещё раз.' }
};

const L = ['A','B','C','D'];
const STORAGE_KEY = 'niveau-fr-progress-v2';
let screen = 'picker'; // 'picker' | 'banner' | 'question' | 'certificate'
let stageIdx = 0;
let cur = 0;
let answered = [];
let userAns = [];
let allResults = {};
let certLevel = null;
let currentSpeakText = null;

function getApp() { return document.getElementById('app'); }

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      screen, stageIdx, cur, answered, userAns, allResults, certLevel
    }));
  } catch (e) { /* storage unavailable - progress just won't persist */ }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || typeof s.stageIdx !== 'number' || !LEVEL_ORDER[s.stageIdx]) return false;
    screen = s.screen || 'picker';
    stageIdx = s.stageIdx; cur = s.cur || 0;
    answered = s.answered || []; userAns = s.userAns || [];
    allResults = s.allResults || {}; certLevel = s.certLevel || null;
    return true;
  } catch (e) { return false; }
}

function clearProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// Best-effort French text to pronounce for a question: full sentence with blank filled,
// or a quoted French word/phrase in the question, or the correct option itself if it looks French.
function speakTextFor(q) {
  if (q.q.includes('___')) return q.q.replace(/_+/, q.o[q.a]);
  const quoteMatch = q.q.match(/«([^»]+)»/);
  if (quoteMatch) return quoteMatch[1];
  const ans = q.o[q.a];
  if (!/[а-яА-ЯёЁ]/.test(ans)) return ans;
  return null;
}

function speak(text, btn) {
  if (!('speechSynthesis' in window)) {
    alert('Синтез речи не поддерживается в этом браузере.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.88;
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  if (frVoice) u.voice = frVoice;
  if (btn) { btn.disabled = true; u.onend = () => { btn.disabled = false; }; u.onerror = () => { btn.disabled = false; }; }
  window.speechSynthesis.speak(u);
}

// Some browsers load voices asynchronously - warm the list up.
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function renderLevelTrack() {
  const track = document.getElementById('levelTrack');
  track.innerHTML = LEVEL_ORDER.map((lvl, i) => {
    let cls = 'level-pill';
    if (allResults[lvl]) cls += ' done';
    if (i === stageIdx && (screen === 'banner' || screen === 'question')) cls += ' active';
    return `<span class="${cls}">${lvl}</span>`;
  }).join('');
}

function startApp() {
  const resumed = loadProgress();
  renderLevelTrack();
  if (resumed && screen === 'certificate' && certLevel) renderCertificate(certLevel);
  else if (resumed && screen === 'question') { renderQuestion(); if (answered[cur] !== undefined) restoreState(); }
  else if (resumed && screen === 'banner') renderBanner();
  else renderPicker();
  const hint = document.getElementById('addHint');
  if (hint) hint.textContent = 'Открой эту страницу в браузере телефона и добавь на главный экран через «Поделиться → На экран Домой» - тест будет запускаться как отдельное приложение.';
}

function renderPicker() {
  screen = 'picker';
  saveProgress();
  renderLevelTrack();
  const cardsHtml = LEVEL_ORDER.map(lvl => {
    const r = allResults[lvl];
    const infoHtml = r
      ? `<div class="picker-result">${r.correct}/${r.total} · ${Math.round(r.correct / r.total * 100)}%</div>`
      : `<div class="picker-result picker-result-empty">ещё не пройден</div>`;
    return `
      <div class="picker-card">
        <div class="picker-level">${lvl}</div>
        <div class="picker-info">${infoHtml}</div>
        <button class="btn-primary" onclick="selectLevel('${lvl}')">${r ? 'Пройти заново' : 'Начать'} →</button>
      </div>
    `;
  }).join('');
  getApp().innerHTML = `
    <div class="picker-screen">
      <div class="picker-intro">Выбери, с какого блока начать - необязательно по порядку. За каждый пройденный блок формируется отдельный сертификат.</div>
      <div class="picker-grid">${cardsHtml}</div>
      ${Object.keys(allResults).length > 0 ? `<div class="picker-reset"><button class="link-reset" onclick="restartAll()">Сбросить весь прогресс</button></div>` : ''}
    </div>
  `;
}

function selectLevel(lvl) {
  stageIdx = LEVEL_ORDER.indexOf(lvl);
  renderBanner();
}

function renderBanner() {
  screen = 'banner';
  saveProgress();
  renderLevelTrack();
  const lvl = LEVEL_ORDER[stageIdx];
  const intro = {
    A1: "Базовый уровень. 40 вопросов: être/avoir, артикли, отрицание, глаголы, aller, вопросительные слова, предлоги места, faux amis, числа, время.",
    A2: "Уровень A2. 40 вопросов: passé composé, согласование participe, imparfait, местоимения y/en/lui/leur, gérondif, сравнение, relatifs, conditionnel, futur, faux amis, предлоги времени.",
    B1: "Уровень B1. 40 вопросов: plus-que-parfait, conditionnel passé, discours indirect, gérondif/participe présent, négation, предлоги времени, порядок местоимений, согласование participe, superlatif, faux amis, глаголы с предлогами, relatifs."
  };
  getApp().innerHTML = `
    <div class="stage-banner">
      <h2>Блок ${lvl}</h2>
      <p>${intro[lvl]}</p>
      <button class="btn-primary" onclick="beginBlock()">Начать блок →</button>
    </div>
    <div class="picker-reset"><button class="link-reset" onclick="renderPicker()">← Выбрать другой блок</button></div>
  `;
}

function beginBlock() {
  screen = 'question';
  cur = 0; answered = []; userAns = [];
  saveProgress();
  renderQuestion();
}

function currentBlock() { return BLOCKS[LEVEL_ORDER[stageIdx]]; }

function renderQuestion() {
  renderLevelTrack();
  const block = currentBlock();
  const q = block[cur];
  const pct = Math.round(cur / block.length * 100);
  const correct = userAns.filter((u,i) => u === block[i].a).length;
  const wrong = cur - correct;

  const speakText = speakTextFor(q);
  currentSpeakText = speakText;
  const trHtml = q.tr ? `<div class="tr-row"><div class="tr-label">Перевод</div>${q.tr}</div>` : '';
  const speakHtml = speakText ? `<div class="speak-row"><button class="speak-btn" id="speakbtn" onclick="speak(currentSpeakText, this)">🔊 Слушать произношение</button></div>` : '';

  getApp().innerHTML = `
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">Блок ${LEVEL_ORDER[stageIdx]} · Прогресс</span>
        <span class="progress-nums">${cur + 1} / ${block.length}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stats">
      <div class="stat-pill"><div class="val val-correct">${correct}</div><div class="lbl">верно</div></div>
      <div class="stat-pill"><div class="val val-wrong">${wrong}</div><div class="lbl">ошибок</div></div>
      <div class="stat-pill"><div class="val val-neutral">${block.length - cur - 1}</div><div class="lbl">осталось</div></div>
    </div>
    <div class="q-card">
      <div class="q-meta">
        <span class="q-tag">${q.t}</span>
        <span class="q-number">№ ${cur + 1}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.o.map((opt, i) => `
          <button class="opt" id="opt${i}" onclick="choose(${i})">
            <span class="opt-letter">${L[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp">
        <div class="exp-label">Объяснение</div>
        ${q.e}
        ${trHtml}
        ${speakHtml}
      </div>
    </div>
    <div class="nav">
      <button class="btn-primary" id="nextbtn" onclick="goNext()" ${answered[cur] === undefined ? 'disabled' : ''}>
        ${cur === block.length - 1 ? 'Завершить блок →' : 'Следующий →'}
      </button>
    </div>
  `;
  if (answered[cur] !== undefined) restoreState();
}

function choose(i) {
  if (answered[cur] !== undefined) return;
  answered[cur] = true;
  userAns[cur] = i;
  const q = currentBlock()[cur];
  document.querySelectorAll('.opt').forEach((el, idx) => {
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === i) el.classList.add('wrong');
  });
  document.getElementById('exp').classList.add('show');
  document.getElementById('nextbtn').disabled = false;
  saveProgress();
}

function restoreState() {
  const q = currentBlock()[cur];
  const i = userAns[cur];
  document.querySelectorAll('.opt').forEach((el, idx) => {
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === i && i !== q.a) el.classList.add('wrong');
  });
  document.getElementById('exp').classList.add('show');
}

function goNext() {
  const block = currentBlock();
  if (cur < block.length - 1) { cur++; saveProgress(); renderQuestion(); }
  else finishBlock();
}

function finishBlock() {
  const lvl = LEVEL_ORDER[stageIdx];
  const block = currentBlock();
  const correct = userAns.filter((u, i) => u === block[i].a).length;
  const mistakes = userAns.map((u, i) => u !== block[i].a ? i : null).filter(i => i !== null)
    .map(i => ({ q: block[i].q, t: block[i].t, your: block[i].o[userAns[i]], right: block[i].o[block[i].a], e: block[i].e }));

  allResults[lvl] = { correct, total: block.length, mistakes, date: new Date().toISOString() };

  screen = 'certificate';
  certLevel = lvl;
  saveProgress();
  renderCertificate(lvl);
}

function renderCertificate(lvl) {
  renderLevelTrack();
  const r = allResults[lvl];
  const share = r.correct / r.total;
  const pct = Math.round(share * 100);
  const passed = share >= GATE[lvl];
  const title = passed ? `Уровень ${lvl} подтверждён ✓` : `Уровень ${lvl} - есть над чем поработать`;
  const msg = passed ? LEVEL_MESSAGES[lvl].pass : LEVEL_MESSAGES[lvl].fail;
  const dateStr = new Date(r.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  const nextIdx = LEVEL_ORDER.indexOf(lvl) + 1;
  const nextLvl = LEVEL_ORDER[nextIdx];

  getApp().innerHTML = `
    <div class="result-screen">
      <div class="result-hero cert-hero">
        <div class="cert-seal">${passed ? '🏅' : '📄'}</div>
        <div class="result-level">${lvl}</div>
        <div class="result-title">${title}</div>
        <div class="result-msg">${msg}</div>
        <div class="breakdown">
          <div class="stat-pill"><div class="val">${r.correct}/${r.total}</div><div class="lbl">верно</div></div>
          <div class="stat-pill"><div class="val">${pct}%</div><div class="lbl">результат</div></div>
        </div>
        <div class="cert-date">Сертификат сформирован ${dateStr}</div>
      </div>
      ${r.mistakes.length === 0 ? `<div class="mistakes-section"><div style="text-align:center;color:var(--correct-border);">🎉 Ни одной ошибки в этом блоке!</div></div>` : `
        <div class="mistakes-section">
          <div class="mistakes-title">
            Разбор ошибок
            <span class="mistakes-badge">${r.mistakes.length}</span>
          </div>
          ${r.mistakes.map(m => `
            <div class="mistake-item">
              <span class="mistake-tag">${lvl} · ${m.t}</span>
              <div class="mistake-q">${m.q}</div>
              <div class="mistake-answers">
                <div class="ans-row"><span class="ans-badge wrong">Твой ответ</span> ${m.your}</div>
                <div class="ans-row"><span class="ans-badge correct">Правильно</span> ${m.right}</div>
              </div>
              <div class="mistake-exp">${m.e}</div>
            </div>
          `).join('')}
        </div>
      `}
      <div class="result-nav">
        ${nextLvl ? `<button class="btn-restart" onclick="selectLevel('${nextLvl}')">Следующий блок: ${nextLvl} →</button>` : ''}
        <button class="btn-restart" onclick="selectLevel('${lvl}')">Пройти ${lvl} заново</button>
      </div>
      <div class="picker-reset"><button class="link-reset" onclick="renderPicker()">← Все блоки</button></div>
    </div>
  `;
}

function restartAll() {
  stageIdx = 0; cur = 0; answered = []; userAns = []; allResults = {}; certLevel = null;
  screen = 'picker';
  clearProgress();
  startApp();
}

startApp();
</script>
<p style="text-align:center;font-size:13px;margin:24px 0 8px;"><a href="privacy.html" style="color:#2d5a4e;">Политика конфиденциальности</a></p>
</body>
</html>
